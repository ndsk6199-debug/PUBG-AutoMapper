name: Build Windows
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate profile JSON
        shell: pwsh
        run: ./scripts/validate-profile.ps1
      - name: Restore
        run: dotnet restore desktop/PubgAutoMapper.csproj
      - name: Build
        run: dotnet build desktop/PubgAutoMapper.csproj -c Release -p:Platform=x64 --no-restore
      - name: Publish Windows
        run: dotnet publish desktop/PubgAutoMapper.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o artifacts/PUBG-AutoMapper
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PUBG-AutoMapper-win-x64
          path: artifacts/PUBG-AutoMapper
